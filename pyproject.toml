[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "readme-gen-cli"
version = "0.1.0"
description = "Automatically generate README files for Python projects using Agno agents"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Agnibha Sarkar"}
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.5.0",
    "agno>=0.0.6",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]

[project.scripts]
readme-gen = "readme_gen.cli:app"

[tool.black]
line-length = 88

[tool.isort]
profile = "black" 