[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "readme-gen-cli"
version = "0.1.0"
description = "Automatically generate README files for Python projects using Agno agents"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Agnibha Sarkar"}
]
dependencies = [
    "typer==0.15.3",
    "rich==14.0.0",
    "pydantic==2.11.4",
    "python-dotenv==1.1.0",
    "agno==1.4.3",
    "openai==1.76.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]

[project.scripts]
readme-gen = "readme_gen.cli:app"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.hatch.build.targets.wheel]
packages = ["readme_gen"] 